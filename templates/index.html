<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - DockerForge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Liquid Glass Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="navbar">
        <div class="brand">DockerForge</div>
        <div class="nav-links">
            <a href="{{ url_for('index') }}" class="active">Tasks</a>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2>DockerForge 3.0</h2>
            <form id="task-form" class="task-form">
                <input type="text" id="task-input" placeholder="What needs to be done?" required>
                <button type="submit" class="btn btn-primary">Add Task</button>
            </form>

            <ul id="task-list" class="task-list">
                <!-- Tasks will be loaded here dynamically via JavaScript -->
            </ul>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadTasks);

        const form = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const taskList = document.getElementById('task-list');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = taskInput.value.trim();
            if (!title) return;

            try {
                const response = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title })
                });
                
                if (response.ok) {
                    const newTask = await response.json();
                    taskInput.value = '';
                    addTaskToDOM(newTask);
                    removeEmptyState();
                }
            } catch (error) {
                console.error("Error adding task", error);
            }
        });

        async function loadTasks() {
            try {
                const response = await fetch('/api/tasks');
                const tasks = await response.json();
                
                taskList.innerHTML = '';
                if (tasks.length === 0) {
                    showEmptyState();
                } else {
                    tasks.forEach(task => addTaskToDOM(task));
                }
            } catch (error) {
                console.error("Error loading tasks", error);
            }
        }

        function addTaskToDOM(task) {
            const li = document.createElement('li');
            li.className = 'task-item';
            li.id = `task-${task.id}`;
            li.innerHTML = `
                <span class="task-title">${task.title}</span>
                <button onclick="deleteTask(${task.id})" class="btn btn-danger">Delete</button>
            `;
            taskList.appendChild(li);
        }

        async function deleteTask(id) {
            try {
                const response = await fetch(`/api/tasks/${id}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    document.getElementById(`task-${id}`).remove();
                    if (taskList.children.length === 0) {
                        showEmptyState();
                    }
                }
            } catch (error) {
                console.error("Error deleting task", error);
            }
        }

        function showEmptyState() {
            taskList.innerHTML = `<li class="empty-state">No tasks pending. You're all caught up!</li>`;
        }

        function removeEmptyState() {
            const emptyState = document.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }
        }
    </script>
</body>
</html>
